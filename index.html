<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slaughterhouse Race</title>
<style>
:root{--bg:#120607;--panel:#1d0b0c;--line:#4a1517;--red:#820404;--text:#f3e6e3;--mute:#a88986;--field:#2a1011;--d:#3fd45a;--h:#ff7ab8;--e:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#120607}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Barlow","Segoe UI",Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 18px 48px}
h1{font:800 34px/1.1 "Arial Black",Impact,sans-serif;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 24px}
.sentence{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;font-size:18px;line-height:2.6}
select{font:inherit;font-weight:600;color:var(--text);background:var(--field);border:1px solid var(--line);border-bottom:3px solid var(--red);border-radius:4px;padding:4px 8px;margin:0 2px;max-width:100%}
select:focus-visible,button:focus-visible{outline:2px solid #ff5b4d;outline-offset:2px}
.hide{display:none}
.run{display:block;margin-top:16px;font-weight:600}
.run input{display:block;width:100%;margin-top:6px;font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-bottom:3px solid var(--red);border-radius:4px;padding:10px}
.run input:focus-visible{outline:2px solid #ff5b4d;outline-offset:2px}
.erun{color:#dbdee1;font-size:14px;white-space:pre-line;margin-top:4px}
.rec{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;margin-bottom:8px}
.rec input{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:0}
.rec input:focus-visible{outline:2px solid #ff5b4d;outline-offset:2px}
.tgs{display:flex;gap:6px}
.tog{width:26px;height:26px;margin:0;padding:0;border-radius:5px;border:2px solid rgba(255,255,255,.35);opacity:.25;cursor:pointer}
.tog[aria-pressed="true"]{opacity:1;border-color:#fff}
.key{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--mute);margin:0 0 12px}
.rec span.l{color:var(--mute);font-size:14px}
button{margin-top:18px;width:100%;font:800 16px "Arial Black",sans-serif;color:#fff;background:var(--red);border:0;border-radius:4px;padding:14px;cursor:pointer}
button:hover{background:#a00606}
h2{font-size:15px;color:var(--mute);margin:30px 0 8px;font-weight:600}
.discord{background:#313338;border-radius:6px;padding:14px 16px;font:15px/1.4 "gg sans","Segoe UI",Arial,sans-serif;color:#dbdee1}
.msg{display:flex;gap:12px}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-weight:800;color:#fff}
.name{font-weight:600;color:#fff}.bot{background:#5865f2;color:#fff;font-size:10px;border-radius:3px;padding:1px 5px;margin-left:4px}
.ping{background:rgba(88,101,242,.3);color:#c9cdfb;border-radius:3px;padding:0 3px}
.embed{margin-top:6px;background:#2b2d31;border-left:4px solid #820404;border-radius:4px;padding:10px 14px}
.etitle{font-weight:700;color:#fff;margin-bottom:6px}
.cube{display:inline-block;width:16px;height:16px;border-radius:3px;vertical-align:-3px;border:2px solid rgba(255,255,255,.35)}
.note{color:var(--mute);font-size:13px;margin-top:14px}
#toast{margin-top:12px;color:#ffb3a8;min-height:1.4em}
</style>
</head>
<body>
<main>
<h1>Slaughterhouse Race</h1>
<p class="sub">Post a run update to the server.</p>

<div class="sentence">
  <select id="kind" aria-label="Improvement or tie">
    <option value="imp">Improvement</option>
    <option value="tie">Tie</option>
  </select><br>
  <select id="player" aria-label="Player">
    <option value="DJ">DJ</option>
    <option value="Hydrors">Hydrors</option>
    <option value="Eydidie">Eydidie</option>
  </select>
  <span id="verb">has achieved a new</span>
  <select id="cat" aria-label="Category">
    <option>hardest run</option>
    <option>longest run</option>
    <option>best from 0</option>
    <option>best to 100</option>
  </select>!
  <select id="emoji" aria-label="Player emoji">
    <option value="d">DJ (green)</option>
    <option value="h">Hydrors (pink)</option>
    <option value="e">Eydidie (white)</option>
  </select>
</div>

<label class="run">What was the run? <input id="run" type="text" maxlength="30" placeholder="e.g. 74-95" autocomplete="off"></label>

<h2>Current records (edit if out of date)</h2>
<div class="key"><span><span class="cube" style="background:var(--d)"></span> DJ</span><span><span class="cube" style="background:var(--h)"></span> Hydrors</span><span><span class="cube" style="background:var(--e)"></span> Eydidie</span><span>Click a square to turn it on or off.</span></div>
<div id="records"></div>

<button id="send" type="button">Post to Discord</button>
<div id="toast" role="status"></div>

<h2>How it will look in Discord</h2>
<div class="discord">
  <div class="msg">
    <div class="av">S</div>
    <div>
      <div><span class="name">Slaughterhouse Race</span><span class="bot">APP</span></div>
      <div><span class="ping">@Race Ping</span></div>
      <div class="embed"><div class="etitle" id="prev"></div><div class="erun" id="prevrun"></div></div>
    </div>
  </div>
</div>
<p class="note">Posting pings the race role in Discord.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const col={d:"var(--d)",h:"var(--h)",e:"var(--e)"};
const EMOJI={d:"<:dj_cube:1532053455911256165>",h:"<:hydrors_cube:1541256383570251886>",e:"<:eydidie_cube:1534219788216307883>"};
const WEBHOOK_URL="https://discordapp.com/api/webhooks/1558650935088119850/pyVDpf5Mrm7fDuRptFupKuv9q7F6gepAfdmIMM9dG_LbiDDMx6NJZq-Om1RC3c7Z_Get";
const ROLE_ID="1532385233352134747";
const KEYS=["best from 0","best to 100","longest run","hardest run"];
const LABEL={"best from 0":"Best from 0","best to 100":"Best to 100","longest run":"Longest run","hardest run":"Hardest run"};
let rec={"best from 0":{run:"27%",by:["h"]},"best to 100":{run:"82-100",by:["d","h","e"]},"longest run":{run:"74-95",by:["d"]},"hardest run":{run:"74-95",by:["d"]}};
try{const sv=JSON.parse(localStorage.getItem("slaughterhouse_records")||"null");
  if(sv)for(const k of KEYS)if(sv[k]&&typeof sv[k].run==="string"&&Array.isArray(sv[k].by))rec[k]={run:sv[k].run.slice(0,30),by:sv[k].by.filter(x=>EMOJI[x])};}catch(e){}
const ORDER=["d","h","e"],NAME={d:"DJ",h:"Hydrors",e:"Eydidie"};
const ord=by=>ORDER.filter(x=>by.includes(x));
function save(){try{localStorage.setItem("slaughterhouse_records",JSON.stringify(rec));}catch(e){}}
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cubes=by=>ord(by).map(x=>'<span class="cube" style="background:'+col[x]+'"></span>').join(" ");

function buildPanel(){
  const box=$("records");box.innerHTML="";
  for(const k of KEYS){
    const row=document.createElement("div");row.className="rec";
    row.innerHTML='<span class="l">'+LABEL[k]+'</span><input maxlength="30" aria-label="'+LABEL[k]+'" value="'+esc(rec[k].run)+'"><span class="tgs"></span>';
    row.querySelector("input").addEventListener("input",e=>{rec[k].run=e.target.value;save();render();});
    const wrap=row.querySelector(".tgs");
    for(const w of ORDER){
      const b=document.createElement("button");b.type="button";b.className="tog";b.style.background=col[w];
      b.title=NAME[w];b.setAttribute("aria-label",LABEL[k]+" held by "+NAME[w]);b.dataset.k=k;b.dataset.w=w;
      b.setAttribute("aria-pressed",String(rec[k].by.includes(w)));
      b.addEventListener("click",()=>{const i=rec[k].by.indexOf(w);if(i>=0)rec[k].by.splice(i,1);else rec[k].by.push(w);save();render();});
      wrap.appendChild(b);
    }
    box.appendChild(row);
  }
}
function projected(){
  const p=JSON.parse(JSON.stringify(rec)),k=$("cat").value,em=$("emoji").value,run=$("run").value.trim();
  if($("kind").value==="tie"){if(!p[k].by.includes(em))p[k].by.push(em);}
  else p[k]={run:run||p[k].run,by:[em]};
  return p;
}
function render(){
  const tie=$("kind").value==="tie";
  $("verb").textContent=tie?"has tied the":"has achieved a new";
  const em=$("emoji").value,p=projected();
  $("prev").innerHTML=esc($("player").value+" "+$("verb").textContent+" "+$("cat").value+"! ")+cubes([em]);
  const run=$("run").value.trim();
  $("prevrun").innerHTML="Run: "+esc(run||"...")+"\n"+KEYS.map(k=>"\n"+LABEL[k]+": "+esc(p[k].run)+" "+cubes(p[k].by)).join("\n");
  document.querySelectorAll(".tog").forEach(b=>b.setAttribute("aria-pressed",String(rec[b.dataset.k].by.includes(b.dataset.w))));
}
["kind","player","cat","emoji"].forEach(i=>$(i).addEventListener("change",render));
$("run").addEventListener("input",render);

$("send").addEventListener("click",async()=>{
  const run=$("run").value.trim();
  if(!run){$("toast").textContent="Enter what the run was first.";$("run").focus();return;}
  const btn=$("send");btn.disabled=true;$("toast").textContent="Posting...";
  const p=projected();
  const verb=$("kind").value==="tie"?"has tied the":"has achieved a new";
  const title=$("player").value+" "+verb+" "+$("cat").value+"! "+EMOJI[$("emoji").value];
  const description="Run: "+run+"\n\n"+KEYS.map(k=>LABEL[k]+": "+p[k].run+" "+ord(p[k].by).map(x=>EMOJI[x]).join(" ")).join("\n\n");
  try{
    const r=await fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({content:"<@&"+ROLE_ID+">",allowed_mentions:{roles:[ROLE_ID]},embeds:[{title:title,description:description,color:0x820404}]})});
    if(r.ok){
      rec=p;try{localStorage.setItem("slaughterhouse_records",JSON.stringify(rec));}catch(e){}
      $("run").value="";buildPanel();render();$("toast").textContent="Posted to Discord.";
    }else $("toast").textContent="Could not post (error "+r.status+"). Check the webhook URL.";
  }catch(e){$("toast").textContent="Could not reach Discord. Check the webhook URL.";}
  btn.disabled=false;
});
buildPanel();render();
</script>
</body>
</html>
